name: Publish merged tree
on:
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  group: publish-merged
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout ohm-website-patches
      uses: actions/checkout@v4
      with:
        path: patches
    - name: Read upstream base
      id: base
      run: echo "ref=$(cat UPSTREAM_BASE)" >> "$GITHUB_OUTPUT"
      working-directory: patches
    - name: Checkout openstreetmap-website at upstream base
      uses: actions/checkout@v4
      with:
        repository: openstreetmap/openstreetmap-website
        ref: ${{ steps.base.outputs.ref }}
        path: website
        persist-credentials: false
    - name: Apply OHM patches, overlays and removals
      run: ./scripts/apply.sh ../website
      working-directory: patches
    - name: Commit and push to ohm-website-merged
      working-directory: website
      env:
        TOKEN: ${{ secrets.MERGED_REPO_TOKEN }}
      run: |
        git config user.name "ohm-bot"
        git config user.email "bot@openhistoricalmap.org"
        git add -A
        git commit -m "Apply ohm-website-patches@${GITHUB_SHA::7} onto upstream ${{ steps.base.outputs.ref }}"
        # Tag each render so every published SHA stays reachable after the
        # force-push — ohm-deploy pins these SHAs and GitHub stops serving
        # archives for unreachable commits.
        git tag "merged-${GITHUB_SHA::7}"
        git push --force "https://x-access-token:${TOKEN}@github.com/OpenHistoricalMap/ohm-website-merged.git" HEAD:main "refs/tags/merged-${GITHUB_SHA::7}"
