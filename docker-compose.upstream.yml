# Dev stack for the HOST-merged tree produced by ./scripts/merge.sh.
# The merged worktree (../ohm-website-merged) is bind-mounted into the
# container, so you edit files locally and rails picks them up live.
#
# Flow:
#   ./scripts/merge.sh          # build ../ohm-website-merged, fix conflicts in your editor
#   docker compose -f docker-compose.upstream.yml up --build
services:
  web:
    build:
      context: ${MERGED_DIR:-../ohm-website-merged}
    environment:
      PIDFILE: /tmp/pids/server.pid
    volumes:
      - ${MERGED_DIR:-../ohm-website-merged}:/app
      - /app/node_modules/
      - web-tmp:/app/tmp
      - web-storage:/app/storage
    networks:
      - web_network
    tmpfs:
      /tmp/pids/
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    command: bash ./start.sh
    depends_on:
      - db
      - memcached
    env_file:
      - overlays/ohm-docker.dev.env

  memcached:
    image: memcached:latest
    ports:
      - '11211:11211'
    networks:
      - web_network

  db:
    image: ghcr.io/openhistoricalmap/db:0.0.1-0.dev.git.3423.h66378a9e
    ports:
      - "54322:5432"  # 54321 is taken by the osm-dev stack on this machine
    env_file:
      - overlays/ohm-docker.dev.env
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - web_network

volumes:
  web-tmp:
  web-storage:
  db-data:
    driver: local
    name: ohm_web_pg17

networks:
  web_network:
    driver: bridge
