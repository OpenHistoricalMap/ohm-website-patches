services:
  web:
    build:
      context: ./merged
    environment:
      PIDFILE: /tmp/pids/server.pid
    volumes:
      - ./merged:/app
      # dev-only entrypoint lives in this repo, not in the merged tree
      # (mounted outside /app: Docker cannot mount a file inside another bind)
      - ./start.sh:/usr/local/bin/ohm-start.sh
      - /app/node_modules/
      - web-tmp:/app/tmp
      - web-storage:/app/storage
      # selenium-manager downloads geckodriver on every fresh container;
      # persist its cache so an offline github does not abort the test suite
      - web-selenium-cache:/root/.cache/selenium
    networks:
      - web_network
    tmpfs:
      /tmp/pids/
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    command: ["bash", "/usr/local/bin/ohm-start.sh"]
    depends_on:
      - db
      - memcached
    env_file:
      - dev.env

  memcached:
    image: memcached:latest
    ports:
      - '11211:11211'
    networks:
      - web_network

  db:
    image: ghcr.io/openhistoricalmap/db:0.0.1-0.dev.git.3423.h66378a9e
    ports:
      - "54321:5432"
    env_file:
        - dev.env
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - web_network

volumes:
  web-tmp:
  web-storage:
  web-selenium-cache:
  db-data:
    driver: local
    name: ohm_web_pg17

networks:
  web_network:
    driver: bridge
    